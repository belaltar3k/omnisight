<div class="p-6 space-y-6">
  <div>
    <h1 class="text-xl font-bold text-white">Annotations</h1>
    <p class="text-sm text-text-secondary mt-0.5">
      Temporal, audio, and pose labeling tasks
    </p>
  </div>
  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-panel border border-border-subtle rounded-lg p-4 text-center">
      <p class="text-2xl font-bold text-white">47</p>
      <p class="text-xs text-text-secondary mt-1">Pending Tasks</p>
    </div>
    <div class="bg-panel border border-border-subtle rounded-lg p-4 text-center">
      <p class="text-2xl font-bold text-emerald-400">128</p>
      <p class="text-xs text-text-secondary mt-1">Completed</p>
    </div>
    <div class="bg-panel border border-border-subtle rounded-lg p-4 text-center">
      <p class="text-2xl font-bold text-brand">12</p>
      <p class="text-xs text-text-secondary mt-1">In Progress</p>
    </div>
  </div>
  <div class="space-y-2">
    @for (task of tasks$ | async; track task.id) {
      <div
        class="bg-panel border border-border-subtle rounded-lg px-4 py-3 flex items-center gap-4 hover:border-brand/30 cursor-pointer transition-colors"
      >
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white truncate">
            {{ task.title }}
          </p>
          <p class="text-xs text-text-muted mt-0.5">
            {{ task.type }} · {{ task.clips }} clips
          </p>
        </div>
        <span
          class="text-[10px] font-medium px-2 py-0.5 rounded-full shrink-0"
          [class]="
            task.status === 'pending'
              ? 'bg-yellow-500/20 text-yellow-400'
              : task.status === 'in-progress'
                ? 'bg-brand/20 text-brand'
                : 'bg-emerald-500/20 text-emerald-400'
          "
        >
          {{ task.status.replace("_", " ") }}
        </span>
      </div>
    }
  </div>
</div>
