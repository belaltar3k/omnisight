<div class="flex flex-col h-full p-6">
    <div class="mb-6">
        <h1 class="text-xl font-bold text-white">VLM Semantic Search</h1>
        <p class="text-sm text-text-secondary mt-0.5">
            Search across incident captions using natural language
        </p>
    </div>
    <div class="flex-1 bg-panel border border-border-subtle rounded-lg flex flex-col overflow-hidden">
        <div class="flex-1 overflow-y-auto p-4 space-y-4">
            @if (messages().length === 0) {
                <div class="flex items-center justify-center h-full">
                    <div class="text-center text-text-muted">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            width="40"
                            height="40"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            class="mx-auto mb-3"
                        >
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                        </svg>
                        <p class="text-sm font-medium text-text-secondary">
                            Ask anything about your incidents
                        </p>
                        <div class="mt-4 flex flex-wrap gap-2 justify-center">
                            @for (q of suggestions; track q) {
                                <app-button
                                    (click)="sendMessage(q)"
                                    type="button"
                                    icon=""
                                    [message]="q"
                                ></app-button>
                            }
                        </div>
                    </div>
                </div>
            }
            @for (msg of messages(); track $index) {
                <div class="flex gap-3" [class.flex-row-reverse]="msg.role === 'user'">
                    <div
                        class="w-7 h-7 rounded-full shrink-0 flex items-center justify-center text-xs font-bold"
                        [class]="msg.role === 'user' ? 'bg-brand text-white' : 'bg-border-subtle text-text-secondary'"
                    >
                        {{ msg.role === "user" ? "U" : "AI" }}
                    </div>
                    <div
                        class="max-w-[75%] rounded-lg px-3 py-2 text-xs leading-relaxed"
                        [class]="msg.role === 'user' ? 'bg-brand/20 text-text-secondary' : 'bg-border-subtle text-text-secondary'"
                    >
                        {{ msg.text }}
                        <p class="text-[9px] text-text-muted mt-1">{{ msg.time }}</p>
                    </div>
                </div>
            }
        </div>
        <div class="border-t border-border-subtle p-3 flex gap-3 justify-between items-center">
            <app-input
                class="w-full"
                [(ngModel)]="input"
                id="semantic-search"
                name="semantic-search"
                placeholder="Search incidents by scene, behavior, location…"
                (keydown.enter)="sendMessage(input)"
            ></app-input>
            <app-button
                (click)="sendMessage(input)"
                [btnStyle]="BtnStylesEnum.BTN_BLUE"
                message="Send"
                icon="paper-plane"
                type="button"
            ></app-button>
        </div>
    </div>
</div>
