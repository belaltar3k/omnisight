<div class="p-6 space-y-6">
  <div>
    <h1 class="text-xl font-bold text-white">Datasets</h1>
    <p class="text-sm text-text-secondary mt-0.5">
      Training datasets and feature stores
    </p>
  </div>
  <div class="bg-panel border border-border-subtle rounded-lg overflow-hidden">
    <table class="w-full text-sm">
      <thead>
        <tr class="border-b border-border-subtle">
          <th class="text-left px-4 py-3 text-xs font-semibold text-text-secondary">Name</th>
          <th class="text-left px-4 py-3 text-xs font-semibold text-text-secondary">Type</th>
          <th class="text-left px-4 py-3 text-xs font-semibold text-text-secondary">Videos</th>
          <th class="text-left px-4 py-3 text-xs font-semibold text-text-secondary">Features</th>
          <th class="text-left px-4 py-3 text-xs font-semibold text-text-secondary">Size</th>
          <th class="text-left px-4 py-3 text-xs font-semibold text-text-secondary">Created</th>
        </tr>
      </thead>
      <tbody>
        @for (ds of datasets$ | async; track ds.id) {
          <tr class="border-b border-border-subtle hover:bg-border-subtle cursor-pointer transition-colors">
            <td class="px-4 py-3 text-xs font-mono text-brand">
              {{ ds.name }}
            </td>
            <td class="px-4 py-3">
              <span class="text-[10px] px-2 py-0.5 rounded-full bg-purple-500/20 text-purple-400">{{ ds.type }}</span>
            </td>
            <td class="px-4 py-3 text-xs text-text-secondary">
              {{ ds.videos ? ds.videos.toLocaleString() : "-" }}
            </td>
            <td class="px-4 py-3 text-xs text-text-secondary">
              {{ ds.features ? ds.features.toLocaleString() : "-" }}
            </td>
            <td class="px-4 py-3 text-xs text-text-secondary">{{ ds.size }}</td>
            <td class="px-4 py-3 text-xs text-text-secondary">{{ ds.created }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
