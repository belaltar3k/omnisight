<div class="p-6 space-y-6">
  <div>
    <h1 class="text-xl font-bold text-white">Analytics</h1>
    <p class="text-sm text-text-secondary mt-0.5">Multimodal intelligence insights and trends</p>
  </div>
  <div class="flex gap-2 overflow-x-auto">
    @for (tab of tabs; track tab.id) {
      <app-button
        type="button"
        icon=""
        [message]="tab.label"
        (click)="activeTab.set(tab.id)"
      ></app-button>
    }
  </div>
  <div class="bg-panel border border-border-subtle rounded-lg p-8 flex items-center justify-center min-h-[400px]">
    <div class="text-center text-text-muted">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mx-auto mb-3"><line x1="18" x2="18" y1="20" y2="10"/><line x1="12" x2="12" y1="20" y2="4"/><line x1="6" x2="6" y1="20" y2="14"/></svg>
      <p class="text-sm font-medium text-text-secondary">{{ currentTab?.label }} Chart</p>
      <p class="text-xs mt-1">Connect to the backend API to display live analytics data</p>
    </div>
  </div>
</div>
