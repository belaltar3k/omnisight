<div class="p-6 space-y-6">
  <div class="flex items-center justify-between">
    <div>
      <h1 class="text-xl font-bold text-white">Alerts</h1>
      <p class="text-sm text-text-secondary mt-0.5">Active notification alerts across your system</p>
    </div>
    <app-button [btnStyle]="BtnStylesEnum.BTN_BLUE" message="Alert Preferences" icon="gear" type="button" (click)="openPreferences()"></app-button>
  </div>
  <div class="space-y-2">
    @for (alert of (alerts$ | async); track alert.alertId) {
      <div
        class="bg-panel border rounded-lg px-4 py-3 flex items-center gap-4 hover:border-brand/30 transition-colors"
        [class]="alert.acknowledgedAt ? 'border-border-subtle' : 'border-brand/20'"
      >
        <div
          class="w-8 h-8 rounded-full flex items-center justify-center shrink-0"
          [class]="priorityClass(alert.priority)"
        >
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <path d="M12 9v4"/>
            <path d="M12 17h.01"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-white">{{ alert.alertType }}</p>
          <p class="text-xs text-text-secondary mt-0.5">Incident: {{ alert.incidentId }}</p>
        </div>
        <div class="text-right shrink-0 flex flex-col items-end gap-1">
          <p class="text-xs text-text-muted">{{ alert.sentAt | date:'short' }}</p>
          @if (!alert.acknowledgedAt) {
            <div class="flex items-center gap-2">
              <span class="inline-block w-2 h-2 rounded-full bg-brand"></span>
              <app-button message="Acknowledge" icon="check" type="button" (click)="acknowledge(alert)"></app-button>
            </div>
          } @else {
            <span class="text-[10px] text-emerald-400">Acknowledged</span>
          }
        </div>
      </div>
    }
  </div>
</div>
