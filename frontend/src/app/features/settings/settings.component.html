<div class="p-6 space-y-6">
  <div>
    <h1 class="text-xl font-bold text-white">Settings</h1>
    <p class="text-sm text-text-secondary mt-0.5">System configuration and administration</p>
  </div>
  <div class="flex gap-2">
    @for (tab of tabs; track tab.id) {
      <app-button
        type="button"
        icon=""
        [message]="tab.label"
        (click)="activeTab.set(tab.id)"
      ></app-button>
    }
  </div>
  <div class="grid grid-cols-2 gap-6">
    @for (setting of currentSettings; track setting.label) {
      <div class="bg-panel border border-border-subtle rounded-lg p-4">
        <p class="text-xs font-semibold text-white mb-1">{{ setting.label }}</p>
        <p class="text-[11px] text-text-muted mb-3">{{ setting.description }}</p>
        @if (setting.type === 'toggle') {
          <div class="flex items-center gap-2">
            <div class="w-9 h-5 rounded-full transition-colors cursor-pointer"
                 [class]="setting.value ? 'bg-brand' : 'bg-border-subtle'">
              <div class="w-4 h-4 bg-white rounded-full mt-0.5 transition-transform"
                   [class]="setting.value ? 'translate-x-4 ml-0' : 'ml-0.5'"></div>
            </div>
            <span class="text-xs text-text-secondary">{{ setting.value ? 'Enabled' : 'Disabled' }}</span>
          </div>
        } @else {
          <app-input
            [id]="settingId(setting.label)"
            [ngModel]="setting.value"
          ></app-input>
        }
      </div>
    }
  </div>
</div>
