<div class="h-full flex flex-col bg-panel rounded-sm overflow-hidden">
  <div class="flex items-center justify-between px-3 py-2.5 border-b border-border-subtle shrink-0">
    <div class="flex items-center gap-2">
      <span class="text-xs font-semibold text-white">Events</span>
      <span class="flex items-center gap-1 bg-black/30 rounded px-1.5 py-0.5">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400" [class.animate-pulse]="!reducedMotion()"></span>
        <span class="text-[9px] font-bold text-emerald-400">LIVE</span>
      </span>
    </div>
    <div class="flex items-center gap-2 text-text-secondary">
      <app-button message="" icon="magnifying-glass" type="button"></app-button>
    </div>
  </div>
  <div class="flex-1 overflow-y-auto">
    @for (event of events; track $index) {
      <div class="flex items-center gap-2 px-3 py-2 border-b border-border-subtle hover:bg-border-subtle cursor-pointer transition-colors">
        <div class="w-12 h-10 rounded shrink-0 flex items-center justify-center relative overflow-hidden {{ event.thumbGradientClass }}">
          <span [class]="event.iconColor" [innerHTML]="event.iconSvg"></span>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-medium text-white truncate">{{ event.title }}</p>
          <p class="text-[9px] text-text-muted truncate">{{ event.time }}</p>
        </div>
      </div>
    }
  </div>
</div>
