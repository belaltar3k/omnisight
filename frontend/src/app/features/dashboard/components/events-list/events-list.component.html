<div class="h-full flex flex-col bg-panel rounded-sm overflow-hidden">
  <div class="flex items-center justify-between px-3 py-2.5 border-b border-border-subtle shrink-0">
    <span class="text-xs font-semibold text-white">Recent Incidents</span>
  </div>
  <div class="flex-1 overflow-y-auto">
    @for (inc of (incidents$ | async); track inc.id) {
      <a [routerLink]="['/incidents', inc.id]"
         class="flex items-center gap-2 px-3 py-2 border-b border-border-subtle hover:bg-border-subtle cursor-pointer transition-colors">
        <div class="w-2 h-2 rounded-full shrink-0"
             [class]="inc.priority === 'critical' ? 'bg-red-500' : inc.priority === 'high' ? 'bg-orange-500' : inc.priority === 'medium' ? 'bg-yellow-500' : 'bg-blue-500'">
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-medium text-white truncate capitalize">{{ inc.crimeType }}</p>
          <p class="text-[10px] text-text-muted">{{ inc.detectedAt | date:'HH:mm, MMM d' }}</p>
        </div>
        <span class="text-[9px] px-1.5 py-0.5 rounded shrink-0"
              [class]="inc.status === 'new' ? 'bg-red-500/20 text-red-400' : inc.status === 'resolved' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-yellow-500/20 text-yellow-400'">
          {{ inc.status }}
        </span>
      </a>
    } @empty {
      <div class="flex items-center justify-center py-8">
        <p class="text-xs text-text-muted">No incidents</p>
      </div>
    }
  </div>
</div>
