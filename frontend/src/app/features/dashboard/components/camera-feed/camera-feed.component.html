<div class="relative w-full h-full rounded-sm overflow-hidden bg-surface-base border border-border-subtle flex items-center justify-center">
  @if (streamUrl) {
    <img
      [src]="streamUrl"
      [alt]="label() + ' live feed'"
      class="w-full h-full object-cover"
      (error)="onStreamError($event)"
    />
  } @else {
    <div class="flex flex-col items-center gap-2 text-text-muted opacity-50">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/>
        <circle cx="12" cy="13" r="3"/>
      </svg>
      <span class="text-[10px]">No stream</span>
    </div>
  }
  <!-- Label overlay -->
  <div class="absolute top-0 left-0 right-0 flex items-center justify-between px-2 py-1.5 pointer-events-none">
    <div class="flex items-center gap-1.5">
      @if (streamUrl) {
        <span class="flex items-center gap-1 bg-black/50 rounded px-1.5 py-0.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span class="text-[9px] font-bold text-emerald-400 tracking-wider">LIVE</span>
        </span>
      }
      @if (label()) {
        <span class="text-[10px] font-medium text-white bg-black/40 rounded px-1.5 py-0.5">{{ label() }}</span>
      }
    </div>
  </div>
</div>
