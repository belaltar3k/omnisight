<div class="h-full flex flex-col bg-panel rounded-sm overflow-hidden">
  <div class="flex items-center justify-between px-3 py-2.5 border-b border-border-subtle shrink-0">
    <span class="text-xs font-semibold text-white">Device List</span>
    <div class="flex items-center gap-2 text-text-secondary">
      <app-button message="" icon="sliders" type="button"></app-button>
      <app-button message="" icon="magnifying-glass" type="button"></app-button>
    </div>
  </div>
  <div class="flex-1 overflow-y-auto">
    @for (device of devices; track device.name) {
      <div class="flex items-center gap-2 px-3 py-2 border-b border-border-subtle hover:bg-border-subtle cursor-pointer transition-colors">
        <div class="w-5 h-5 rounded-full bg-border-subtle border border-border-accent flex items-center justify-center shrink-0">
          <div class="w-2.5 h-2.5 rounded-full bg-emerald-500"></div>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-[11px] font-medium text-white truncate">{{ device.name }}</p>
          <p class="text-[10px] text-text-muted truncate">{{ device.location }}</p>
        </div>
      </div>
    }
  </div>
</div>
