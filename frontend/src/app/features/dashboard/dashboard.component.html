<div class="flex flex-col h-full bg-surface-base">
  <!-- Top row -->
  <div class="flex flex-1 min-h-0 gap-[3px] p-[3px] pb-0">
    <div class="w-[200px] shrink-0">
      <app-device-list />
    </div>
    <div class="w-[240px] shrink-0">
      <app-event-details />
    </div>
    <div class="flex-1 min-w-0">
      @if ((cameras$ | async); as cameras) {
        @if (cameras.length > 0) {
          <app-camera-feed [label]="cameras[0].name" [cameraCode]="cameras[0].code" [showControls]="true" />
        } @else {
          <app-camera-feed label="Main Feed" [showControls]="true" />
        }
      } @else {
        <app-camera-feed label="Main Feed" [showControls]="true" />
      }
    </div>
  </div>
  <!-- Bottom row -->
  <div class="flex h-[46%] min-h-0 gap-[3px] p-[3px] pt-[3px]">
    <div class="w-[200px] shrink-0">
      <app-events-list />
    </div>
    <div class="flex-1 grid grid-cols-2 grid-rows-2 gap-[3px] min-w-0">
      @if ((cameras$ | async); as cameras) {
        <app-camera-feed [label]="cameras[1]?.name ?? 'Camera 2'" [cameraCode]="cameras[1]?.code ?? null" />
        <app-camera-feed [label]="cameras[2]?.name ?? 'Camera 3'" [cameraCode]="cameras[2]?.code ?? null" />
        <app-camera-feed [label]="cameras[3]?.name ?? 'Camera 4'" [cameraCode]="cameras[3]?.code ?? null" />
        <app-camera-feed [label]="cameras[4]?.name ?? 'Camera 5'" [cameraCode]="cameras[4]?.code ?? null" />
      } @else {
        <app-camera-feed label="Camera 2" />
        <app-camera-feed label="Camera 3" />
        <app-camera-feed label="Camera 4" />
        <app-camera-feed label="Camera 5" />
      }
    </div>
  </div>
</div>
