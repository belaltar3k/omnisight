<div class="p-6 space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-xl font-bold text-white">Training Jobs</h1>
            <p class="text-sm text-text-secondary mt-0.5">
                Manage and monitor model training runs
            </p>
        </div>
        <app-button [btnStyle]="BtnStylesEnum.BTN_BLUE" message="Submit Job" icon="plus" type="button"></app-button>
    </div>
    <div class="space-y-3">
        @for (job of (jobs$ | async); track job.id) {
            <div class="bg-panel border border-border-subtle rounded-lg p-4">
                <div class="flex items-center justify-between mb-3">
                    <div class="flex items-center gap-3">
                        <span
                            class="text-[10px] font-medium px-2 py-0.5 rounded-full"
                            [class]="statusClass(job.status)"
                        >{{ job.status }}</span>
                        <div>
                            <p class="text-sm font-semibold text-white">{{ job.modelId }}</p>
                            <p class="text-xs text-text-muted">
                                {{ job.datasetId }} · Started {{ job.startTime }}
                            </p>
                        </div>
                    </div>
                    <p class="text-xs text-text-secondary font-mono">{{ job.id }}</p>
                </div>
                @if (job.status === "running") {
                    <div class="mt-2">
                        <div class="flex justify-between text-[10px] text-text-muted mb-1">
                            <span>{{ job.progress }}%</span>
                        </div>
                        @if (job.progress) {
                            <div class="h-1 bg-border-subtle rounded-full overflow-hidden">
                                <div
                                    class="h-full bg-brand rounded-full transition-all"
                                    [class.w-full]="job.progress > 80"></div>
                            </div>
                        }
                    </div>
                }
            </div>
        }
    </div>
</div>
