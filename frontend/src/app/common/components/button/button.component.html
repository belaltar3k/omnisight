<button
        [type]="type()"
        [disabled]="disabled()"
        class="inline-flex items-center justify-center gap-2 w-full
         h-10 px-4
         text-sm font-medium
         rounded-lg
         transition-all duration-200
         disabled:opacity-60
         disabled:cursor-not-allowed"
        [class]="btnStyle() === BtnStylesEnum.BTN_BLUE
    ? 'bg-brand text-white hover:bg-brand hover:shadow-brand'
    : 'border border-border-subtle text-text-secondary hover:text-white hover:border-brand/40'"
>
    @if (icon()) {
        <i [class]="iconClass()"></i>
    }

    {{ message() }}
</button>
