<div class="relative flex flex-col gap-1.5 ">

  @if (label()) {
    <label class="text-xs text-text-secondary" [for]="id()">
      {{ label() }}
    </label>
  }

  <div class="relative ">

    @if (element() === 'input') {
      <input
        [type]="currentType()"
        [value]="value()"
        [placeholder]="placeholder()"
        [id]="id()"
        [name]="name()"
        [disabled]="isDisabled()"
        [attr.autocomplete]="autocomplete() || null"
        [attr.required]="required() || null"
        (input)="onInput($event)"
        (blur)="onBlur()"
        class="w-full bg-surface-well border border-border-subtle rounded-md px-3 py-2 text-xs text-white placeholder-text-muted focus:outline-none focus:border-brand transition-colors"
        [class.pr-10]="isPassword()"
      />
    }

    @if (element() === 'textarea') {
      <textarea
        [value]="value()"
        [placeholder]="placeholder()"
        [id]="id()"
        [name]="name()"
        [disabled]="isDisabled()"
        [attr.autocomplete]="autocomplete() || null"
        [attr.required]="required() || null"
        (input)="onInput($event)"
        (blur)="onBlur()"
        class="w-full bg-surface-well border border-border-subtle rounded-md px-3 py-2 text-sm text-white placeholder-text-muted
               focus:outline-none focus:border-brand transition-colors
               disabled:cursor-not-allowed disabled:opacity-60"
      ></textarea>
    }

    @if (isPassword()) {
      <button
        type="button"
        (click)="showPassword.set(!showPassword())"
        class="absolute inset-y-0 end-0 flex items-center px-3 text-text-muted hover:text-text-secondary transition-colors"
        [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
      >
        <i class="fas text-sm" [class.fa-eye]="showPassword()" [class.fa-eye-slash]="!showPassword()"></i>
      </button>
    }

  </div>

</div>
