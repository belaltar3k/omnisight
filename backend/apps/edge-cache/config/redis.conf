# Sentinel - Edge Cache Service (Redis) Configuration
# Optimized for pure caching workload at the edge

# Network
bind 0.0.0.0
port 6379

# Memory Management
# 4GB max memory set in docker-compose, setting Redis limit to 3.5GB to leave room for overhead
maxmemory 3500mb
# Evict least recently used keys, out of all keys
maxmemory-policy allkeys-lru

# Disable Persistence (Pure Cache)
# No RDB saving
save ""
# No AOF
appendonly no

# Performance Tuning
# Maximum number of connected clients
maxclients 10000

# Do not run as daemon in Docker
daemonize no

# Logging
loglevel notice
