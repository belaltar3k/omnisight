# -----------------------------
# PostgreSQL configuration file
# -----------------------------

# Load extensions early (pg_cron needs this)
shared_preload_libraries = 'pg_cron'

# Setup pg_cron database
cron.database_name = 'sentinel_edge'

listen_addresses = '*'

# -----------------------------
# Resource Tuning (Target: 4 CPU, 8GB RAM as per serv.txt)
# -----------------------------
max_connections = 200
shared_buffers = 2GB                 # 25% of 8GB total RAM
effective_cache_size = 6GB           # 75% of 8GB total RAM
maintenance_work_mem = 1GB
checkpoint_completion_target = 0.9
wal_buffers = 16MB
default_statistics_target = 100
random_page_cost = 1.1               # SSD drives

# Worker processes (Target: 4 CPUs)
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Logging
log_timezone = 'UTC'
log_statement = 'none'
log_min_duration_statement = 1000    # Log slow queries taking > 1 second
