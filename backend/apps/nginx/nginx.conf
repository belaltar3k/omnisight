events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/x-font-ttf image/svg+xml;
    gzip_min_length 1024;

    # Tune timeouts for large API responses and long-running requests
    proxy_read_timeout    120s;
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;

    upstream api_gateway {
        server api-gateway:3000;
    }

    upstream ai_detection {
        server ai-detection:8010;
    }

    server {
        listen 80;
        server_name _;

        # ── REST API → api-gateway ────────────────────────────────────────
        location /api/ {
            proxy_pass         http://api_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        '';

            # Allow large bodies (video uploads, evidence files)
            client_max_body_size 100m;
        }

        # ── MJPEG stream → ai-detection (no auth, disable buffering) ─────
        location /stream/ {
            proxy_pass         http://ai_detection;
            proxy_http_version 1.1;
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   Connection      '';

            # Critical: disable buffering so multipart frames reach the client live
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            chunked_transfer_encoding on;
        }

        # ── Angular SPA static files ──────────────────────────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            # Push all unknown paths back to index.html for Angular routing
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively (Angular hashes filenames)
            location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
