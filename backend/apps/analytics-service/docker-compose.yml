version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: omnisight-timescaledb
    environment:
      POSTGRES_USER: omnisight_user
      POSTGRES_PASSWORD: omnisight_password
      POSTGRES_DB: omnisight_analytics
    ports:
      - "5437:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  timescaledb_data: