services:
  postgres:
    image: postgres:16
    container_name: sentinel-auth-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_auth
    ports:
      - "5432:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sentinel-auth-redis
    restart: always
    ports:
      - "6379:6379"

  camera-postgres:
    image: postgres:16
    container_name: sentinel-camera-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_camera
    ports:
      - "5433:5432"
    volumes:
      - camera_postgres_data:/var/lib/postgresql/data

  incident-postgres:
    image: postgres:16
    container_name: sentinel-incident-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_incident
    ports:
      - "5434:5432"
    volumes:
    - incident_postgres_data:/var/lib/postgresql/data
  user-postgres:
    image: postgres:16
    container_name: sentinel-user-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_user
    ports:
      - "5435:5432"
    volumes:
    - user_postgres_data:/var/lib/postgresql/data
  alert-postgres:
    image: postgres:16
    container_name: sentinel-alert-postgres
    restart: always
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel123
      POSTGRES_DB: sentinel_alert
    ports:
      - "5436:5432"
    volumes:
      - alert_postgres_data:/var/lib/postgresql/data
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.2
    container_name: sentinel-zookeeper
    platform: linux/amd64
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.3.2
    container_name: sentinel-kafka
    platform: linux/amd64
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
  rabbitmq:
    image: rabbitmq:3-management
    container_name: sentinel-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI at http://localhost:15672
    environment:
      RABBITMQ_DEFAULT_USER: sentinel
      RABBITMQ_DEFAULT_PASS: sentinel123
volumes:
  auth_postgres_data:
  camera_postgres_data:
  incident_postgres_data:
  user_postgres_data:
  alert_postgres_data:
  kafka_data:
  zookeeper_data:
  rabbitmq_data:
